<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicode ↔ Bijoy Converter</title>
<style>
  @font-face{
    font-family: 'SutonnyMJ';
    src: url('https://cdn.jsdelivr.net/gh/Dyrimon/bangla_fonts@main/proprietary/Sutonny/SutonnyMJ_Regular.ttf') format('truetype'),
         url('https://raw.githubusercontent.com/Dyrimon/bangla_fonts/main/proprietary/Sutonny/SutonnyMJ_Regular.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root{
    --ink:#132033; --muted:#6b7c93; --line:#e3e9f2; --card:#ffffff;
    --accent:#2f6bff; --accent-dark:#1f4fd8;
    --warn:#e67e22; --err:#d63b3b; --ok:#137a45;
    --bijoy-font: 'SutonnyMJ', 'Sutonny MJ', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:28px 16px 56px; color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 8% -8%, #dfeaff 0%, rgba(223,234,255,0) 62%),
      radial-gradient(900px 500px at 98% 2%, #d8f6e8 0%, rgba(216,246,232,0) 58%),
      linear-gradient(170deg,#f4f7fd 0%,#fbfdff 55%,#f2fbf6 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:1100px;margin:0 auto;}
  header{text-align:center;margin-bottom:20px;}
  h1{margin:0 0 6px;font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-.02em;}
  h1 span{color:var(--accent);}
  header p{margin:0;color:var(--muted);font-size:.9rem;}

  .dir-toggle{
    display:flex;justify-content:center;gap:0;margin:0 auto 14px;
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    width:fit-content;background:#fff;box-shadow:0 6px 16px -12px rgba(19,32,51,.3);
  }
  .dir-toggle button{
    background:transparent;border:0;font:inherit;font-weight:600;
    font-size:.88rem;padding:10px 22px;cursor:pointer;color:var(--muted);
    transition:.15s ease;
  }
  .dir-toggle button.active{background:var(--accent);color:#fff;}
  .dir-toggle button:not(.active):hover{background:#f2f6ff;color:var(--ink);}

  .topbar{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:8px;margin:0 auto 18px;max-width:960px;
    padding:10px 14px;background:rgba(255,255,255,.8);
    border:1px solid var(--line);border-radius:12px;
  }
  .topbar button{
    background:#fff;border:1px solid var(--line);font:inherit;
    font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:8px;
    cursor:pointer;transition:.15s;color:var(--ink);
  }
  .topbar button:hover{border-color:#c3d2ea;background:#f7faff;}
  .topbar button.on{background:var(--ok);color:#fff;border-color:var(--ok);}
  .topbar button.danger{border-color:#f0c0c0;color:var(--err);}
  .topbar button.danger:hover{background:#fde8e8;}
  .topbar .status{
    font-size:.75rem;font-weight:600;color:var(--muted);
    padding:5px 11px;border-radius:99px;background:#eef3ff;color:#3a5bbf;
  }
  .topbar .status.ok{background:#e3f8ec;color:var(--ok);}
  .topbar .status.warn{background:#fff3e0;color:#a35b00;}
  .topbar .status.loading{background:#eef3ff;color:#3a5bbf;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:780px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 12px 32px -20px rgba(19,32,51,.4);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 15px;border-bottom:1px solid var(--line);
    background:linear-gradient(#fbfdff,#f5f8fd);
    font-size:.75rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);
  }
  .panel-head-left{display:flex;align-items:center;gap:8px;}
  .panel-head-right{display:flex;align-items:center;gap:8px;}

  .icon-btn{
    background:transparent;border:1px solid var(--line);border-radius:6px;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--muted);transition:.15s;padding:0;
  }
  .icon-btn:hover{background:#f2f6ff;border-color:#c3d2ea;color:var(--accent);}
  .icon-btn svg{width:14px;height:14px;}

  .badge{
    font-size:.7rem;font-weight:600;letter-spacing:0;text-transform:none;
    background:#eef3ff;color:#3a5bbf;padding:3px 9px;border-radius:99px;
    white-space:nowrap;
  }
  .badge.err{background:#fde8e8;color:var(--err);}
  .badge.ok{background:#e3f8ec;color:var(--ok);}

  textarea{
    border:0;outline:0;resize:none;width:100%;height:560px;
    padding:15px;font-size:1.02rem;line-height:1.85;
    color:var(--ink);background:transparent;
    font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Nirmala UI",sans-serif;
    overflow-y:auto;
  }
  .output-view{
    height:560px;overflow-y:auto;
    padding:15px;
    background:transparent;overflow-wrap:break-word;
    white-space:pre-wrap;word-break:break-word;
    font-family:var(--bijoy-font);
    font-size:1.35rem;line-height:2.05;
    color:#08243f;
  }
  .output-view.raw{
    font-family:"Consolas","SFMono-Regular",Menlo,monospace;
    font-size:1rem;line-height:1.85;
    color:#0f2a4a;
  }
  .output-view .flagged{
    text-decoration:underline;text-decoration-style:wavy;
    text-decoration-color:var(--err);text-decoration-thickness:1.5px;
    background:#fde8e8;border-radius:3px;padding:0 1px;
    cursor:pointer;transition:.15s;
  }
  .output-view .flagged:hover{background:#fbd5d5;}
  .output-view .flagged.highlight{
    background:#ffe680;outline:2px solid var(--warn);outline-offset:1px;
  }

  .word-tooltip{
    position:fixed;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px -8px rgba(19,32,51,.35);
    padding:8px;display:none;z-index:100;
    font-family:"Segoe UI",system-ui,sans-serif;
    font-size:.8rem;min-width:220px;
  }
  .word-tooltip.show{display:block;}
  .word-tooltip .tooltip-pair{
    display:flex;flex-direction:column;gap:3px;margin-bottom:6px;
  }
  .word-tooltip .tooltip-row{
    display:flex;align-items:center;gap:6px;
    font-family:"Consolas",monospace;font-size:.78rem;
  }
  .word-tooltip .tooltip-label{
    font-family:"Segoe UI",sans-serif;font-size:.68rem;
    color:var(--muted);font-weight:600;min-width:42px;
  }
  .word-tooltip .tooltip-val{
    color:#0f2a4a;background:#f2f6ff;padding:3px 7px;
    border-radius:5px;flex:1;word-break:break-all;
    overflow:hidden;text-overflow:ellipsis;
  }
  .word-tooltip .tooltip-val.bijoy{font-family:var(--bijoy-font);font-size:.95rem;}
  .word-tooltip button{
    width:100%;font:inherit;font-size:.78rem;font-weight:600;
    padding:6px 10px;border-radius:6px;border:0;cursor:pointer;
    background:var(--accent);color:#fff;transition:.15s;
  }
  .word-tooltip button:hover{background:var(--accent-dark);}
  .word-tooltip .tooltip-hint{
    font-size:.68rem;color:var(--muted);margin-top:6px;text-align:center;
  }

  .error-panel{
    margin:14px 0 0;background:#fff;border:1px solid var(--line);
    border-radius:12px;overflow:hidden;
  }
  .error-panel summary{
    padding:12px 16px;cursor:pointer;font-size:.85rem;font-weight:700;
    list-style:none;display:flex;align-items:center;gap:8px;
    color:var(--ink);user-select:none;
  }
  .error-panel summary::-webkit-details-marker{display:none;}
  .error-panel summary::before{
    content:"▸";display:inline-block;transition:.2s;color:var(--muted);
  }
  .error-panel[open] summary::before{transform:rotate(90deg);}
  .error-panel summary:hover{background:#f7faff;}
  .error-panel .count{
    background:#fde8e8;color:var(--err);font-size:.72rem;
    padding:2px 8px;border-radius:99px;font-weight:700;
  }
  .error-panel .count.zero{background:#e3f8ec;color:var(--ok);}
  .error-list{
    list-style:none;margin:0;padding:0;max-height:280px;overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .error-list li{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;border-bottom:1px solid #f2f5fa;
    font-size:.85rem;cursor:pointer;transition:.12s;
  }
  .error-list li:last-child{border-bottom:0;}
  .error-list li:hover{background:#f9fbff;}
  .error-list .word{
    font-family:"Consolas",monospace;color:#0f2a4a;
    background:#f2f6ff;padding:3px 8px;border-radius:6px;
    font-size:.82rem;flex-shrink:0;
  }
  .error-list .word.bijoy{font-family:var(--bijoy-font);font-size:1rem;}
  .error-list .msg{color:var(--muted);flex:1;}
  .error-list .add-dict{
    font-size:.72rem;font-weight:600;padding:5px 10px;
    background:#fff;color:var(--accent);border:1px solid var(--accent);
    border-radius:6px;cursor:pointer;flex-shrink:0;
    transition:.15s;
  }
  .error-list .add-dict:hover{background:var(--accent);color:#fff;}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#132033;color:#fff;padding:10px 22px;border-radius:99px;
    font-size:.85rem;opacity:0;pointer-events:none;transition:.25s ease;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.5);z-index:50;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Unicode <span>↔</span> Bijoy Converter</h1>
    <p>দুই দিকেই রূপান্তর · বানান যাচাই · ভুল চিহ্নিতকরণ</p>
  </header>

  <div class="dir-toggle">
    <button class="dir-btn active" data-dir="uni2bi" type="button">Unicode → Bijoy</button>
    <button class="dir-btn" data-dir="bi2uni" type="button">Bijoy → Unicode</button>
  </div>

  <div class="topbar">
    <button id="lightBtn" type="button">Light Check</button>
    <button id="deepBtn" type="button">Deep Check</button>
    <button id="offBtn" type="button" class="on">Off</button>
    <button id="clearBtn" type="button" class="danger">Clear</button>
    <span id="dictStatus" class="status">Spell check off</span>
  </div>

  <main class="grid">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-head-left">
          <span id="inLabel">Unicode Input</span>
        </div>
        <div class="panel-head-right">
          <button class="icon-btn" id="copyInBtn" title="Copy input" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <span class="badge" id="inCount">0 chars</span>
        </div>
      </div>
      <textarea id="input" spellcheck="false" rows="20" placeholder="এখানে বাংলা ইউনিকোড টেক্সট পেস্ট করুন…"></textarea>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-head-left">
          <span id="outLabel">Bijoy Output</span>
        </div>
        <div class="panel-head-right">
          <button class="icon-btn" id="copyOutBtn" title="Copy output" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <span class="badge ok" id="errBadge">Clean</span>
          <span class="badge" id="outCount">0 chars</span>
        </div>
      </div>
      <div id="output" class="output-view"></div>
    </section>
  </main>

  <details class="error-panel" id="errorPanel" open>
    <summary>
      Flagged words <span class="count zero" id="errCount">0</span>
    </summary>
    <ul class="error-list" id="errorList">
      <li style="justify-content:center;color:#8896a8;cursor:default;">
        No flagged words. Enable spell check to detect unknown words.
      </li>
    </ul>
  </details>
</div>

<div class="word-tooltip" id="wordTooltip">
  <div class="tooltip-pair">
    <div class="tooltip-row">
      <span class="tooltip-label">Unicode</span>
      <span class="tooltip-val" id="tooltipUni">—</span>
    </div>
    <div class="tooltip-row">
      <span class="tooltip-label">Bijoy</span>
      <span class="tooltip-val bijoy" id="tooltipBijoy">—</span>
    </div>
  </div>
  <button type="button" id="addToDictBtn">Add both to dictionary</button>
  <div class="tooltip-hint">won't be flagged again in either direction</div>
</div>

<div class="toast" id="toast">Copied!</div>

<script type="module">

   nspell loader
   ================================================================ */
let nspellLib = null;
async function loadNspell() {
  if (nspellLib) return nspellLib;
  const mod = await import("https://esm.sh/nspell@2.1.5");
  nspellLib = mod.default || mod;
  return nspellLib;
}

const SORTED_LIG_KEYS = Object.keys(LIG).sort((a,b) => b.length - a.length);

/* ================================================================
   Reverse maps
   ================================================================ */
const REVERSE_LIG = {};
Object.keys(LIG)
  .sort((a,b) => LIG[b].length - LIG[a].length)
  .forEach(u => { if (!REVERSE_LIG[LIG[u]]) REVERSE_LIG[LIG[u]] = u; });

const REVERSE_BASE = {};
Object.keys(BASE).forEach(u => {
  if (!REVERSE_BASE[BASE[u]]) REVERSE_BASE[BASE[u]] = u;
});

REVERSE_BASE["v"] = "া";
REVERSE_BASE["x"] = "ী";
REVERSE_BASE["y"] = "ু";
REVERSE_BASE["~"] = "ূ";
REVERSE_BASE["\u2026"] = "ৃ";

const ALL_REVERSE = Object.assign({}, REVERSE_LIG, REVERSE_BASE);
const REVERSE_KEYS = Object.keys(ALL_REVERSE).sort((a,b) => b.length - a.length);

const REVERSE_DIGIT = {"0":"০","1":"১","2":"২","3":"৩","4":"৪","5":"৫","6":"৬","7":"৭","8":"৮","9":"৯"};

/* ================================================================
   Source cleanup
   ================================================================ */
function cleanUnicode(s) {
  return s.normalize ? s.normalize("NFC") : s;
}
function recompose(s) {
  return s
    .replace(/[\u200C\u200D\uFEFF]/g, "")
    .replace(/\u09AF\u09BC/g, "\u09DF")
    .replace(/\u09A1\u09BC/g, "\u09DC")
    .replace(/\u09A2\u09BC/g, "\u09DD")
    .replace(/\u09C7\u09BE/g, "\u09CB")
    .replace(/\u09C7\u09D7/g, "\u09CC")
    .replace(/[\u09BC\u09D7]/g, "");
}

/* ================================================================
   Unicode → Bijoy
   ================================================================ */
function uniToBijoy(text) {
  if (!text) return "";
  const src = recompose(cleanUnicode(text));
  let out = "";
  let i = 0;
  const n = src.length;

  while (i < n) {
    let bij = null, advance = 0;

    for (const key of SORTED_LIG_KEYS) {
      if (src.substr(i, key.length) === key) {
        bij = LIG[key];
        advance = key.length;
        break;
      }
    }

    if (bij === null && src.charAt(i) === "র" && src.charAt(i+1) === HASANTA && i+2 < n) {
      const j = i + 2;
      let cb = null, cl = 0;
      for (const key of SORTED_LIG_KEYS) {
        if (src.substr(j, key.length) === key) { cb = LIG[key]; cl = key.length; break; }
      }
      if (cb === null && CONS_SET.has(src.charAt(j))) { cb = BASE[src.charAt(j)]; cl = 1; }
      if (cb !== null) { bij = cb + "\u00A9"; advance = 2 + cl; }
    }

    if (bij === null && CONS_SET.has(src.charAt(i))) {
      bij = BASE[src.charAt(i)]; advance = 1;
    }

    if (bij !== null) {
      i += advance;
      const vs = src.charAt(i);
      if      (vs === I_KAR)  { bij = "w"       + bij;            i++; }
      else if (vs === E_KAR)  { bij = "\u2021"  + bij;            i++; }
      else if (vs === OI_KAR) { bij = "\u02C6"  + bij;            i++; }
      else if (vs === O_KAR)  { bij = "\u2021"  + bij + "v";      i++; }
      else if (vs === AU_KAR) { bij = "\u2021"  + bij + "\u0160"; i++; }
      else if (VOWEL[vs])     { bij = bij + VOWEL[vs];            i++; }
      out += bij;
      continue;
    }

    const ch = src.charAt(i);
    if (BASE[ch])              { out += BASE[ch];   i++; continue; }
    if (VOWEL[ch])             { out += VOWEL[ch];  i++; continue; }
    if (ch === HASANTA)        { out += "&";        i++; continue; }
    if (ch === I_KAR)          { out += "w";        i++; continue; }
    if (ch === E_KAR)          { out += "\u2021";   i++; continue; }
    if (ch === OI_KAR)         { out += "\u02C6";   i++; continue; }
    if (ch === O_KAR)          { out += "\u2021v";  i++; continue; }
    if (ch === AU_KAR)         { out += "\u2021\u0160"; i++; continue; }
    if (DIGIT[ch])             { out += DIGIT[ch];  i++; continue; }
    if (ch === "।")            { out += "|";        i++; continue; }
    if (ch === "\u2018" || ch === "\u2019") { out += "'"; i++; continue; }
    if (ch === "\u201C" || ch === "\u201D") { out += '"'; i++; continue; }
    if (ch === "\u2013" || ch === "\u2014") { out += "-"; i++; continue; }
    out += ch; i++;
  }
  return out;
}

/* ================================================================
   Bijoy → Unicode
   ================================================================ */
function bijoyToUni(text) {
  if (!text) return "";
  let out = "";
  let lastClusterStart = 0;
  let i = 0;
  const n = text.length;
  let pendingVowel = null;

  while (i < n) {
    const ch = text.charAt(i);

    if (ch === "w" || ch === "\u2021" || ch === "\u02C6") {
      pendingVowel = ch; i++; continue;
    }

    if (ch === "\u00A9") {
      out = out.slice(0, lastClusterStart) + "\u09B0\u09CD" + out.slice(lastClusterStart);
      lastClusterStart += 2;
      i++; continue;
    }

    let matched = null;
    for (const key of REVERSE_KEYS) {
      if (text.substr(i, key.length) === key) {
        matched = ALL_REVERSE[key];
        i += key.length;
        break;
      }
    }

    if (matched === null && REVERSE_DIGIT[ch]) {
      matched = REVERSE_DIGIT[ch]; i++;
    }

    if (matched === null) {
      matched = ch; i++;
    }

    if (pendingVowel !== null) {
      let vu;
      if (pendingVowel === "w") vu = "\u09BF";
      else if (pendingVowel === "\u02C6") vu = "\u09C8";
      else {
        vu = "\u09C7";
        if (text.charAt(i) === "v")           { vu = "\u09CB"; i++; }
        else if (text.charAt(i) === "\u0160") { vu = "\u09CC"; i++; }
      }
      matched = matched + vu;
      pendingVowel = null;
    }

    lastClusterStart = out.length;
    out += matched;
  }
  return out;
}

/* ================================================================
   Spell-check state
   ================================================================ */
let spellChecker = null;
let spellReady = false;
let spellLoading = false;
let spellMode = "off";
let direction = "uni2bi";

/* user dictionary — stores Unicode↔Bijoy pairs */
const USER_DICT_KEY = "bijoy_user_dict_v2";
let userPairs = [];                // [{uni, bijoy}]
let userDictUnicode = new Set();   // for Bijoy→Uni direction (output is Unicode)
let userDictBijoy = new Set();     // for Uni→Bijoy direction (output is Bijoy)

function loadUserDict() {
  try {
    const raw = JSON.parse(localStorage.getItem(USER_DICT_KEY) || "[]");
    userPairs = Array.isArray(raw) ? raw : [];
  } catch (e) {
    userPairs = [];
  }
  userDictUnicode.clear();
  userDictBijoy.clear();
  userPairs.forEach(p => {
    if (p && p.uni)   userDictUnicode.add(p.uni);
    if (p && p.bijoy) userDictBijoy.add(p.bijoy);
  });
}

function saveUserDict() {
  localStorage.setItem(USER_DICT_KEY, JSON.stringify(userPairs));
}

function addPair(uni, bijoy) {
  uni   = (uni   || "").trim();
  bijoy = (bijoy || "").trim();
  if (!uni && !bijoy) return false;

  /* skip duplicates */
  const exists = userPairs.some(p =>
    (uni && p.uni === uni) || (bijoy && p.bijoy === bijoy)
  );
  if (exists) return false;

  userPairs.push({ uni, bijoy });
  if (uni)   userDictUnicode.add(uni);
  if (bijoy) userDictBijoy.add(bijoy);
  saveUserDict();
  return true;
}

/* ================================================================
   Dictionary loader
   ================================================================ */
const DICT_SOURCES = [
  {
    label: "wooorm/bn",
    aff: "https://raw.githubusercontent.com/wooorm/dictionaries/main/dictionaries/bn/index.aff",
    dic: "https://raw.githubusercontent.com/wooorm/dictionaries/main/dictionaries/bn/index.dic"
  },
  {
    label: "LibreOffice bn_BD",
    aff: "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/bn_BD/bn_BD.aff",
    dic: "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/bn_BD/bn_BD.dic"
  },
  {
    label: "LibreOffice bn_IN",
    aff: "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/bn_IN/bn_IN.aff",
    dic: "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/bn_IN/bn_IN.dic"
  }
];

async function fetchFirstAvailable(sources) {
  let lastErr = null;
  for (const src of sources) {
    try {
      const [affRes, dicRes] = await Promise.all([fetch(src.aff), fetch(src.dic)]);
      if (affRes.ok && dicRes.ok) {
        const affText = await affRes.text();
        const dicText = await dicRes.text();
        if (affText.length > 100 && dicText.length > 100) {
          return { aff: affText, dic: dicText, label: src.label };
        }
      }
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("All dictionary sources failed");
}

async function loadDictionary() {
  if (spellReady || spellLoading) return;
  spellLoading = true;
  updateDictStatus("loading");

  try {
    const nspell = await loadNspell();
    const dict = await fetchFirstAvailable(DICT_SOURCES);
    spellChecker = nspell({ aff: dict.aff, dic: dict.dic });
    spellReady = true;
    spellLoading = false;
    updateDictStatus("ready");
    showToast(`Dictionary loaded (${dict.label})`);
    render();
  } catch (err) {
    console.error("Dictionary load failed:", err);
    try {
      const nspell = await loadNspell();
      const affText = "SET UTF-8\n";
      const dicText = FALLBACK_WORDS.length + "\n" + FALLBACK_WORDS.join("\n");
      spellChecker = nspell({ aff: affText, dic: dicText });
      spellReady = true;
      spellLoading = false;
      updateDictStatus("ready", "fallback");
      showToast(`Fallback dictionary (${FALLBACK_WORDS.length} words)`);
      render();
    } catch (e2) {
      console.error(e2);
      spellLoading = false;
      updateDictStatus("error");
      showToast("Dictionary failed to load");
    }
  }
}

/* ================================================================
   Flag unknown words — pairs source/output tokens so we can save both
   ================================================================ */
function flagWords(srcText, outText, dir) {
  if (spellMode === "off" || !spellReady || !spellChecker) {
    return { html: escapeHtml(outText), errors: [] };
  }

  /* Both texts should have identical whitespace structure because the
     converter preserves whitespace exactly. If they don't, we just
     skip pairing and save only the output form. */
  const srcTokens = srcText.split(/(\s+)/);
  const outTokens = outText.split(/(\s+)/);
  const canPair = srcTokens.length === outTokens.length;

  /* Which user-dict set applies to the OUTPUT of this direction? */
  const userSet = (dir === "uni2bi") ? userDictBijoy : userDictUnicode;

  const errors = [];
  let html = "";

  outTokens.forEach((part, i) => {
    if (!part) return;
    if (/^\s+$/.test(part)) { html += escapeHtml(part); return; }

    const core = part.replace(/^[।|,.;:!?"'()\[\]{}<>—–\-]+|[।|,.;:!?"'()\[\]{}<>—–\-]+$/g, "");
    if (!core) { html += escapeHtml(part); return; }

    /* user-dict override — the appropriate form for this direction */
    if (userSet.has(part) || userSet.has(core)) {
      html += escapeHtml(part);
      return;
    }

    const unicodeWord = (dir === "uni2bi") ? bijoyToUni(core) : core;
    const isCorrect = spellChecker.correct(unicodeWord);

    if (isCorrect) {
      html += escapeHtml(part);
    } else {
      const idx = errors.length;
      /* the paired source word (if whitespace aligned) */
      const srcWord = canPair ? srcTokens[i] : "";

      /* which form is uni and which is bijoy depends on direction */
      const uniForm   = (dir === "uni2bi") ? srcWord : part;
      const bijoyForm = (dir === "uni2bi") ? part    : srcWord;

      errors.push({
        word: part,
        core: core,
        index: idx,
        srcWord: srcWord,
        uni: uniForm,
        bijoy: bijoyForm
      });

      html +=
        '<span class="flagged" data-err-idx="' + idx +
        '" data-word="' + escapeHtml(part) +
        '" data-src="' + escapeHtml(srcWord) +
        '" data-uni="' + escapeHtml(uniForm) +
        '" data-bijoy="' + escapeHtml(bijoyForm) +
        '">' + escapeHtml(part) + '</span>';
    }
  });

  return { html, errors };
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ================================================================
   UI elements
   ================================================================ */
const inputEl    = document.getElementById("input");
const outputEl   = document.getElementById("output");
const inCount    = document.getElementById("inCount");
const outCount   = document.getElementById("outCount");
const errBadge   = document.getElementById("errBadge");
const errCount   = document.getElementById("errCount");
const errorList  = document.getElementById("errorList");
const toastEl    = document.getElementById("toast");
const inLabel    = document.getElementById("inLabel");
const outLabel   = document.getElementById("outLabel");
const dictStatus = document.getElementById("dictStatus");
const tooltip     = document.getElementById("wordTooltip");
const tooltipUni  = document.getElementById("tooltipUni");
const tooltipBijoy= document.getElementById("tooltipBijoy");
const addToDictBtn= document.getElementById("addToDictBtn");

let toastTimer = null;
let tooltipHideTimer = null;
let lastOutput = "";
let lastErrors = [];
let tooltipPair = { uni: "", bijoy: "" };

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}

function updateDictStatus(state, extra) {
  if (state === "loading") {
    dictStatus.textContent = "Loading dictionary…";
    dictStatus.className = "status loading";
  } else if (state === "ready") {
    dictStatus.textContent = extra === "fallback"
      ? "Fallback dictionary (" + FALLBACK_WORDS.length + " words)"
      : "Deep check active · " + userPairs.length + " user words";
    dictStatus.className = "status ok";
  } else if (state === "error") {
    dictStatus.textContent = "Dictionary load failed";
    dictStatus.className = "status warn";
  } else if (spellMode === "off") {
    dictStatus.textContent = "Spell check off";
    dictStatus.className = "status";
  } else {
    dictStatus.textContent = "Spell check on";
    dictStatus.className = "status";
  }
}

/* ================================================================
   Render
   ================================================================ */
function render() {
  const src = inputEl.value;
  const out = direction === "uni2bi" ? uniToBijoy(src) : bijoyToUni(src);
  lastOutput = out;

  const flagged = flagWords(src, out, direction);
  lastErrors = flagged.errors;

  outputEl.innerHTML = flagged.html || '<span style="color:#8896a8">…</span>';
  outputEl.classList.toggle("raw", direction === "bi2uni");

  inCount.textContent  = src.length + " chars";
  outCount.textContent = out.length + " chars";

  if (lastErrors.length === 0) {
    errBadge.textContent = "Clean";
    errBadge.className = "badge ok";
    errCount.textContent = "0";
    errCount.className = "count zero";
  } else {
    errBadge.textContent = lastErrors.length + " flagged";
    errBadge.className = "badge err";
    errCount.textContent = lastErrors.length;
    errCount.className = "count";
  }

  renderErrorList();
}

function renderErrorList() {
  if (lastErrors.length === 0) {
    errorList.innerHTML = '<li style="justify-content:center;color:#8896a8;cursor:default;">No flagged words. Enable spell check to detect unknown words.</li>';
    return;
  }
  errorList.innerHTML = "";
  lastErrors.forEach(err => {
    const li = document.createElement("li");
    li.setAttribute("data-err-idx", err.index);
    li.innerHTML =
      '<span class="word' + (direction === "uni2bi" ? " bijoy" : "") + '">' +
        escapeHtml(err.word) +
      '</span>' +
      '<span class="msg">not found in dictionary</span>' +
      '<button class="add-dict" type="button">Add both</button>';
    li.addEventListener("click", ev => {
      if (ev.target.classList.contains("add-dict")) {
        ev.stopPropagation();
        const added = addPair(err.uni, err.bijoy);
        if (added) {
          showToast("Saved pair: " + (err.uni || "—") + " ↔ " + (err.bijoy || "—"));
          updateDictStatus("ready");
        } else {
          showToast("Already in dictionary");
        }
        render();
        return;
      }
      highlightError(err.index);
    });
    errorList.appendChild(li);
  });
}

function highlightError(idx) {
  const target = outputEl.querySelector('[data-err-idx="' + idx + '"]');
  if (!target) return;
  outputEl.querySelectorAll(".highlight").forEach(el => el.classList.remove("highlight"));
  target.classList.add("highlight");
  target.scrollIntoView({ behavior:"smooth", block:"center" });
}

  }

  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
  tooltip.classList.add("show");
});

outputEl.addEventListener("mouseout", e => {
  const span = e.target.closest(".flagged");
  if (!span) return;
  tooltipHideTimer = setTimeout(() => {
    if (!tooltip.matches(":hover")) tooltip.classList.remove("show");
  }, 250);
});

tooltip.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
tooltip.addEventListener("mouseenter", () => clearTimeout(tooltipHideTimer));

addToDictBtn.addEventListener("click", () => {
  const { uni, bijoy } = tooltipPair;
  if (!uni && !bijoy) return;
  const added = addPair(uni, bijoy);
  tooltip.classList.remove("show");
  if (added) {
    showToast("Saved: " + (uni || "—") + " ↔ " + (bijoy || "—"));
    updateDictStatus("ready");
    render();
  } else {
    showToast("Already in dictionary");
  }
});

outputEl.addEventListener("scroll", () => tooltip.classList.remove("show"), { passive: true });

/* ================================================================
   Direction toggle
   ================================================================ */
document.querySelectorAll(".dir-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".dir-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    direction = btn.getAttribute("data-dir");

    if (direction === "uni2bi") {
      inLabel.textContent  = "Unicode Input";
      outLabel.textContent = "Bijoy Output";
      inputEl.placeholder  = "এখানে বাংলা ইউনিকোড টেক্সট পেস্ট করুন…";
    } else {
      inLabel.textContent  = "Bijoy Input";
      outLabel.textContent = "Unicode Output";
      inputEl.placeholder  = "Paste Bijoy text here… (e.g. Avgiv m‡bvq evsjv)";
    }
    tooltip.classList.remove("show");
    render();
  });
});

/* ================================================================
   Spell-check buttons
   ================================================================ */
document.getElementById("lightBtn").addEventListener("click", () => {
  spellMode = "light";
  setActiveModeBtn("lightBtn");
  if (!spellReady) {
    showToast("Loading dictionary…");
    loadDictionary();
  } else {
    updateDictStatus("ready");
  }
  render();
});

document.getElementById("deepBtn").addEventListener("click", () => {
  spellMode = "deep";
  setActiveModeBtn("deepBtn");
  loadDictionary();
  render();
});

document.getElementById("offBtn").addEventListener("click", () => {
  spellMode = "off";
  setActiveModeBtn("offBtn");
  updateDictStatus("off");
  render();
});

function setActiveModeBtn(id) {
  ["lightBtn","deepBtn","offBtn"].forEach(bid => {
    document.getElementById(bid).classList.toggle("on", bid === id);
  });
}

/* ================================================================
   Copy / clear
   ================================================================ */
document.getElementById("clearBtn").addEventListener("click", () => {
  inputEl.value = "";
  render();
  inputEl.focus();
});

document.getElementById("copyInBtn").addEventListener("click", () => {
  copyText(inputEl.value, "Input copied ✓");
});

document.getElementById("copyOutBtn").addEventListener("click", () => {
  copyText(lastOutput, "Output copied ✓");
});

function copyText(text, msg) {
  if (!text) { showToast("Nothing to copy yet"); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast(msg),
      () => { legacyCopy(text); showToast(msg); }
    );
  } else {
    legacyCopy(text); showToast(msg);
  }
}

function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
}

/* ================================================================
   Input listeners
   ================================================================ */
inputEl.addEventListener("input", render);
inputEl.addEventListener("paste", () => setTimeout(render, 0));

/* ================================================================
   Boot
   ================================================================ */
loadUserDict();
setActiveModeBtn("offBtn");
updateDictStatus("off");
render();
</script>
</body>
</html>
