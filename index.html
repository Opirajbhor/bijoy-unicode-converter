<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicode ↔ Bijoy Converter</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/external-flatarticons-blue-flatarticons/65/external-bangala-bangladesh-independence-day-flatarticons-blue-flatarticons.png">
<style>
  @font-face{
    font-family: 'SutonnyMJ';
    src: url('https://cdn.jsdelivr.net/gh/Dyrimon/bangla_fonts@main/proprietary/Sutonny/SutonnyMJ_Regular.ttf') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root{
    --ink:#132033; --muted:#6b7c93; --line:#e3e9f2; --card:#ffffff;
    --accent:#2f6bff; --accent-dark:#1f4fd8;
    --warn:#e67e22; --err:#d63b3b; --ok:#137a45;
    --bijoy-font: 'SutonnyMJ', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:28px 16px 56px; color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 8% -8%, #dfeaff 0%, rgba(223,234,255,0) 62%),
      radial-gradient(900px 500px at 98% 2%, #d8f6e8 0%, rgba(216,246,232,0) 58%),
      linear-gradient(170deg,#f4f7fd 0%,#fbfdff 55%,#f2fbf6 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:1100px;margin:0 auto;}
  header{text-align:center;margin-bottom:20px;}
  h1{margin:0 0 6px;font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-.02em;
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
  h1 .logo{width:34px;height:34px;}
  h1 span{color:var(--accent);}
  header p{margin:0;color:var(--muted);font-size:.9rem;}

  .dir-toggle{display:flex;justify-content:center;margin:0 auto 14px;
    border:1px solid var(--line);border-radius:12px;overflow:hidden;width:fit-content;
    background:#fff;box-shadow:0 6px 16px -12px rgba(19,32,51,.3);}
  .dir-toggle button{background:transparent;border:0;font:inherit;font-weight:600;
    font-size:.88rem;padding:10px 22px;cursor:pointer;color:var(--muted);}
  .dir-toggle button.active{background:var(--accent);color:#fff;}

  .topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:8px;margin:0 auto 18px;max-width:960px;padding:10px 14px;
    background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:12px;}
  .topbar button{background:#fff;border:1px solid var(--line);font:inherit;
    font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--ink);}
  .topbar button:hover{border-color:#c3d2ea;background:#f7faff;}
  .topbar button.on{background:var(--ok);color:#fff;border-color:var(--ok);}
  .topbar button.danger{border-color:#f0c0c0;color:var(--err);}
  .topbar button.dict-btn{background:#f4f0ff;border-color:#d8c8f5;color:#5a3fb8;}
  .topbar .status{font-size:.75rem;font-weight:600;padding:5px 11px;border-radius:99px;
    background:#eef3ff;color:#3a5bbf;}
  .topbar .status.ok{background:#e3f8ec;color:var(--ok);}
  .topbar .status.warn{background:#fff3e0;color:#a35b00;}
  .topbar .status.loading{background:#eef3ff;color:#3a5bbf;}

  /* diagnostic panel */
  .diag{
    max-width:960px;margin:0 auto 14px;
    background:#fff8e6;border:1px solid #ffd98a;border-radius:10px;
    padding:10px 14px;font-size:.8rem;color:#7a5800;
    font-family:Consolas,monospace;display:none;white-space:pre-wrap;
  }
  .diag.show{display:block;}
  .diag b{color:#4a3600;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:780px){.grid{grid-template-columns:1fr;}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 12px 32px -20px rgba(19,32,51,.4);overflow:hidden;display:flex;flex-direction:column;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 15px;border-bottom:1px solid var(--line);background:linear-gradient(#fbfdff,#f5f8fd);
    font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .panel-head-left,.panel-head-right{display:flex;align-items:center;gap:8px;}
  .icon-btn{background:transparent;border:1px solid var(--line);border-radius:6px;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--muted);padding:0;}
  .icon-btn:hover{background:#f2f6ff;border-color:#c3d2ea;color:var(--accent);}
  .icon-btn svg{width:14px;height:14px;}
  .badge{font-size:.7rem;font-weight:600;background:#eef3ff;color:#3a5bbf;
    padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .badge.err{background:#fde8e8;color:var(--err);}
  .badge.ok{background:#e3f8ec;color:var(--ok);}

  textarea{border:0;outline:0;resize:none;width:100%;height:520px;padding:15px;
    font-size:1.02rem;line-height:1.85;color:var(--ink);background:transparent;
    font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Nirmala UI",sans-serif;}
  .output-view{height:520px;overflow-y:auto;padding:15px;overflow-wrap:break-word;
    white-space:pre-wrap;word-break:break-word;font-family:var(--bijoy-font);
    font-size:1.35rem;line-height:2.05;color:#08243f;}
  .output-view.raw{font-family:"Consolas",monospace;font-size:1rem;line-height:1.85;color:#0f2a4a;}
  .output-view .flagged{text-decoration:underline;text-decoration-style:wavy;
    text-decoration-color:var(--err);text-decoration-thickness:1.5px;background:#fde8e8;
    border-radius:3px;padding:0 1px;cursor:pointer;}
  .output-view .flagged:hover{background:#fbd5d5;}

  .word-tooltip{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px -8px rgba(19,32,51,.35);padding:8px;display:none;z-index:100;
    font-size:.8rem;min-width:220px;max-width:calc(100vw - 16px);}
  .word-tooltip.show{display:block;}
  .word-tooltip .tooltip-row{display:flex;align-items:center;gap:6px;
    font-family:Consolas,monospace;font-size:.78rem;margin-bottom:3px;}
  .word-tooltip .tooltip-label{font-size:.68rem;color:var(--muted);font-weight:600;min-width:42px;}
  .word-tooltip .tooltip-val{color:#0f2a4a;background:#f2f6ff;padding:3px 7px;
    border-radius:5px;flex:1;word-break:break-all;}
  .word-tooltip .tooltip-val.bijoy{font-family:var(--bijoy-font);font-size:.95rem;}
  .word-tooltip button{width:100%;font:inherit;font-size:.78rem;font-weight:600;
    padding:7px 10px;border-radius:6px;border:0;cursor:pointer;background:var(--accent);
    color:#fff;margin-top:6px;}
  .word-tooltip button:hover{background:var(--accent-dark);}

  .error-panel,.dict-panel{margin:14px 0 0;background:#fff;border:1px solid var(--line);
    border-radius:12px;overflow:hidden;}
  .error-panel summary,.dict-panel summary{padding:12px 16px;cursor:pointer;
    font-size:.85rem;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;
    color:var(--ink);user-select:none;}
  .error-panel summary::-webkit-details-marker,.dict-panel summary::-webkit-details-marker{display:none;}
  .error-panel summary::before,.dict-panel summary::before{content:"▸";
    display:inline-block;transition:.2s;color:var(--muted);}
  .error-panel[open] summary::before,.dict-panel[open] summary::before{transform:rotate(90deg);}
  .error-panel .count,.dict-panel .count{background:#fde8e8;color:var(--err);
    font-size:.72rem;padding:2px 8px;border-radius:99px;font-weight:700;}
  .error-panel .count.zero,.dict-panel .count.zero{background:#e3f8ec;color:var(--ok);}
  .dict-panel .count{background:#f4f0ff;color:#5a3fb8;}
  .dict-panel .count.zero{background:#f2f4f8;color:#8896a8;}
  .dict-actions{display:flex;justify-content:flex-end;gap:8px;
    padding:10px 16px;border-top:1px solid var(--line);background:#fbfdff;}
  .dict-actions button{font:inherit;font-size:.75rem;font-weight:600;padding:5px 12px;
    border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer;}
  .dict-actions button.danger{border-color:#f0c0c0;color:var(--err);}
  .error-list,.dict-list{list-style:none;margin:0;padding:0;max-height:280px;overflow-y:auto;
    border-top:1px solid var(--line);}
  .error-list li,.dict-list li{display:flex;align-items:center;gap:10px;padding:10px 16px;
    border-bottom:1px solid #f2f5fa;font-size:.85rem;}
  .error-list li{cursor:pointer;}
  .error-list li:hover{background:#f9fbff;}
  .error-list .word,.dict-list .dict-uni{font-family:Consolas,monospace;background:#f2f6ff;
    padding:3px 8px;border-radius:6px;font-size:.82rem;word-break:break-all;}
  .error-list .word.bijoy{font-family:var(--bijoy-font);font-size:1rem;}
  .dict-list .dict-uni{font-family:"Noto Sans Bengali",sans-serif;font-size:.9rem;}
  .dict-list .dict-bijoy{font-family:var(--bijoy-font);font-size:1.1rem;
    background:#f2f6ff;padding:3px 8px;border-radius:6px;color:#08243f;word-break:break-all;}
  .dict-list .dict-del{margin-left:auto;background:transparent;border:1px solid var(--line);
    color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;padding:0;}
  .dict-list .dict-del:hover{background:#fde8e8;color:var(--err);}
  .error-list .msg{color:var(--muted);flex:1;}
  .error-list .add-dict{font-size:.72rem;font-weight:600;padding:5px 10px;background:#fff;
    color:var(--accent);border:1px solid var(--accent);border-radius:6px;cursor:pointer;}
  .error-list .add-dict:hover{background:var(--accent);color:#fff;}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#132033;color:#fff;padding:10px 22px;border-radius:99px;font-size:.85rem;
    opacity:0;pointer-events:none;transition:.25s ease;z-index:50;max-width:calc(100vw - 32px);
    text-align:center;display:flex;align-items:center;gap:12px;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast-action{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);
    color:#fff;font:inherit;font-size:.78rem;font-weight:700;padding:5px 12px;
    border-radius:99px;cursor:pointer;}

  #dictFileInput{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <img class="logo" src="https://img.icons8.com/external-flatarticons-blue-flatarticons/65/external-bangala-bangladesh-independence-day-flatarticons-blue-flatarticons.png" alt="বাংলা">
      Unicode <span>↔</span> Bijoy Converter
    </h1>
    <p>দুই দিকেই রূপান্তর · বানান যাচাই · ভুল চিহ্নিতকরণ</p>
  </header>

  <div class="dir-toggle">
    <button class="dir-btn active" data-dir="uni2bi" type="button">Unicode → Bijoy</button>
    <button class="dir-btn" data-dir="bi2uni" type="button">Bijoy → Unicode</button>
  </div>

  <div class="topbar">
    <button id="lightBtn" type="button">Light Check</button>
    <button id="deepBtn" type="button">Deep Check</button>
    <button id="offBtn" type="button" class="on">Off</button>
    <button id="loadFileBtn" type="button" class="dict-btn">📁 Load Word List</button>
    <button id="dictBtn" type="button" class="dict-btn">My Dictionary <span id="dictBtnCount">(0)</span></button>
    <button id="clearBtn" type="button" class="danger">Clear</button>
    <span id="dictStatus" class="status">Spell check off</span>
  </div>

  <div class="diag" id="diag"></div>

  <main class="grid">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-head-left"><span id="inLabel">Unicode Input</span></div>
        <div class="panel-head-right">
          <button class="icon-btn" id="copyInBtn" title="Copy input" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <span class="badge" id="inCount">0 chars</span>
        </div>
      </div>
      <textarea id="input" spellcheck="false" rows="20" placeholder="এখানে বাংলা ইউনিকোড টেক্সট পেস্ট করুন…"></textarea>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-head-left"><span id="outLabel">Bijoy Output</span></div>
        <div class="panel-head-right">
          <button class="icon-btn" id="copyOutBtn" title="Copy output" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <span class="badge ok" id="errBadge">Clean</span>
          <span class="badge" id="outCount">0 chars</span>
        </div>
      </div>
      <div id="output" class="output-view"></div>
    </section>
  </main>

  <details class="error-panel" id="errorPanel" open>
    <summary>Flagged words <span class="count zero" id="errCount">0</span></summary>
    <ul class="error-list" id="errorList">
      <li style="justify-content:center;color:#8896a8;cursor:default;">No flagged words. Enable spell check to detect unknown words.</li>
    </ul>
  </details>

  <details class="dict-panel" id="dictPanel">
    <summary>My Dictionary <span class="count zero" id="dictCount">0</span></summary>
    <div class="dict-actions">
      <button id="clearAllDictBtn" class="danger" type="button">Clear all</button>
    </div>
    <ul class="dict-list" id="dictList">
      <li style="justify-content:center;color:#8896a8;">No saved words yet.</li>
    </ul>
  </details>
</div>

<div class="word-tooltip" id="wordTooltip">
  <div class="tooltip-row"><span class="tooltip-label">Unicode</span><span class="tooltip-val" id="tooltipUni">—</span></div>
  <div class="tooltip-row"><span class="tooltip-label">Bijoy</span><span class="tooltip-val bijoy" id="tooltipBijoy">—</span></div>
  <button type="button" id="addToDictBtn">Add both to dictionary</button>
</div>

<div class="toast" id="toast">
  <span id="toastMsg">Copied!</span>
  <button class="toast-action" id="toastActionBtn" type="button" style="display:none">Undo</button>
</div>

<input type="file" id="dictFileInput" accept=".txt,.csv">

<script type="module">
/* ================================================================
   Safe localStorage
   ================================================================ */
function lsGet(k, f) { try { const v = localStorage.getItem(k); return v === null ? f : v; } catch(e){ return f; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch(e){ return false; } }

/* ================================================================
   Diagnostic display
   ================================================================ */
const diagEl = document.getElementById("diag");
const diagLines = [];
function diag(msg) {
  const time = new Date().toLocaleTimeString();
  diagLines.push(`[${time}] ${msg}`);
  diagEl.textContent = diagLines.join("\n");
  diagEl.classList.add("show");
  console.log("[DICT]", msg);
}
function diagClear() {
  diagLines.length = 0;
  diagEl.textContent = "";
  diagEl.classList.remove("show");
}

const SORTED_LIG_KEYS = Object.keys(LIG).sort((a,b)=>b.length-a.length);
const REVERSE_LIG = {};
Object.keys(LIG).sort((a,b)=>LIG[b].length-LIG[a].length).forEach(u=>{if(!REVERSE_LIG[LIG[u]])REVERSE_LIG[LIG[u]]=u;});
const REVERSE_BASE = {};
Object.keys(BASE).forEach(u=>{if(!REVERSE_BASE[BASE[u]])REVERSE_BASE[BASE[u]]=u;});
REVERSE_BASE["v"]="া";REVERSE_BASE["x"]="ী";REVERSE_BASE["y"]="ু";REVERSE_BASE["~"]="ূ";REVERSE_BASE["\u2026"]="ৃ";
const ALL_REVERSE = Object.assign({},REVERSE_LIG,REVERSE_BASE);
const REVERSE_KEYS = Object.keys(ALL_REVERSE).sort((a,b)=>b.length-a.length);
const REVERSE_DIGIT = {"0":"০","1":"১","2":"২","3":"৩","4":"৪","5":"৫","6":"৬","7":"৭","8":"৮","9":"৯"};

function cleanUnicode(s){return s.normalize?s.normalize("NFC"):s;}
function recompose(s){
  return s.replace(/[\u200C\u200D\uFEFF]/g,"").replace(/\u09AF\u09BC/g,"\u09DF").replace(/\u09A1\u09BC/g,"\u09DC")
    .replace(/\u09A2\u09BC/g,"\u09DD").replace(/\u09C7\u09BE/g,"\u09CB").replace(/\u09C7\u09D7/g,"\u09CC")
    .replace(/[\u09BC\u09D7]/g,"");
}

function uniToBijoy(text){
  if(!text)return"";
  const src=recompose(cleanUnicode(text));let out="",i=0;const n=src.length;
  while(i<n){
    let bij=null,advance=0;
    for(const key of SORTED_LIG_KEYS){if(src.substr(i,key.length)===key){bij=LIG[key];advance=key.length;break;}}
    if(bij===null&&src.charAt(i)==="র"&&src.charAt(i+1)===HASANTA&&i+2<n){
      const j=i+2;let cb=null,cl=0;
      for(const key of SORTED_LIG_KEYS){if(src.substr(j,key.length)===key){cb=LIG[key];cl=key.length;break;}}
      if(cb===null&&CONS_SET.has(src.charAt(j))){cb=BASE[src.charAt(j)];cl=1;}
      if(cb!==null){bij=cb+"\u00A9";advance=2+cl;}
    }
    if(bij===null&&CONS_SET.has(src.charAt(i))){bij=BASE[src.charAt(i)];advance=1;}
    if(bij!==null){
      i+=advance;const vs=src.charAt(i);
      if(vs===I_KAR){bij="w"+bij;i++;}else if(vs===E_KAR){bij="\u2021"+bij;i++;}
      else if(vs===OI_KAR){bij="\u02C6"+bij;i++;}else if(vs===O_KAR){bij="\u2021"+bij+"v";i++;}
      else if(vs===AU_KAR){bij="\u2021"+bij+"\u0160";i++;}else if(VOWEL[vs]){bij=bij+VOWEL[vs];i++;}
      out+=bij;continue;
    }
    const ch=src.charAt(i);
    if(BASE[ch]){out+=BASE[ch];i++;continue;}
    if(VOWEL[ch]){out+=VOWEL[ch];i++;continue;}
    if(ch===HASANTA){out+="&";i++;continue;}
    if(ch===I_KAR){out+="w";i++;continue;}
    if(ch===E_KAR){out+="\u2021";i++;continue;}
    if(ch===OI_KAR){out+="\u02C6";i++;continue;}
    if(ch===O_KAR){out+="\u2021v";i++;continue;}
    if(ch===AU_KAR){out+="\u2021\u0160";i++;continue;}
    if(DIGIT[ch]){out+=DIGIT[ch];i++;continue;}
    if(ch==="।"){out+="|";i++;continue;}
    if(ch==="\u2018"||ch==="\u2019"){out+="'";i++;continue;}
    if(ch==="\u201C"||ch==="\u201D"){out+='"';i++;continue;}
    if(ch==="\u2013"||ch==="\u2014"){out+="-";i++;continue;}
    out+=ch;i++;
  }
  return out;
}

function bijoyToUni(text){
  if(!text)return"";
  let out="",lastClusterStart=0,i=0,pendingVowel=null;const n=text.length;
  while(i<n){
    const ch=text.charAt(i);
    if(ch==="w"||ch==="\u2021"||ch==="\u02C6"){pendingVowel=ch;i++;continue;}
    if(ch==="\u00A9"){out=out.slice(0,lastClusterStart)+"\u09B0\u09CD"+out.slice(lastClusterStart);lastClusterStart+=2;i++;continue;}
    let matched=null;
    for(const key of REVERSE_KEYS){if(text.substr(i,key.length)===key){matched=ALL_REVERSE[key];i+=key.length;break;}}
    if(matched===null&&REVERSE_DIGIT[ch]){matched=REVERSE_DIGIT[ch];i++;}
    if(matched===null){matched=ch;i++;}
    if(pendingVowel!==null){
      let vu;
      if(pendingVowel==="w")vu="\u09BF";else if(pendingVowel==="\u02C6")vu="\u09C8";
      else{vu="\u09C7";if(text.charAt(i)==="v"){vu="\u09CB";i++;}else if(text.charAt(i)==="\u0160"){vu="\u09CC";i++;}}
      matched=matched+vu;pendingVowel=null;
    }
    lastClusterStart=out.length;out+=matched;
  }
  return out;
}

async function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), ms);
  try {
    const res = await fetch(url, { signal: controller.signal });
    return res;
  } finally { clearTimeout(timeout); }
}

function parseWordList(text) {
  const set = new Set();
  for (const line of text.split(/\r?\n/)) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const word = trimmed.split(/\s+/)[0];
    if (!word) continue;
    if (!/[\u0980-\u09FF]/.test(word)) continue;
    set.add(word);
  }
  return set;
}

async function tryFetchWordList(url) {
  diag(`Trying: ${url}`);
  const res = await fetchWithTimeout(url, 20000);
  diag(`  → HTTP ${res.status} ${res.statusText}`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  diag(`  → ${text.length.toLocaleString()} bytes received`);
  if (text.length < 100) throw new Error("Response too small — probably HTML 404 page");
  const set = parseWordList(text);
  diag(`  → ${set.size.toLocaleString()} Bengali words parsed`);
  if (set.size < 1000) throw new Error("Too few words: " + set.size);
  return set;
}

async function loadDictionary() {
  if (spellReady || spellLoading) return;
  spellLoading = true;
  updateDictStatus("loading");
  diagClear();
  diag("=== Loading word list ===");

  if (location.protocol === "file:") {
    diag("⚠ You are on file:// — fetch() is blocked by the browser.");
    diag("  Use a local server: python3 -m http.server 8000");
    diag("  Or click '📁 Load Word List' to pick the .txt file manually.");
  }

  for (const url of WORD_LIST_URLS) {
    try {
      const set = await tryFetchWordList(url);
      wordSet = set;
      spellReady = true;
      spellLoading = false;
      updateDictStatus("ready");
      showToast(`Loaded ${set.size.toLocaleString()} words`);
      diag(`✓ SUCCESS — ${set.size.toLocaleString()} words from ${url}`);
      render();
      return;
    } catch (err) {
      diag(`✗ FAILED: ${err.message}`);
    }

  diag("All sources failed. Using fallback.");
  wordSet = new Set(FALLBACK_WORDS);
  spellReady = true;
  spellLoading = false;
  updateDictStatus("ready", "fallback");
  showToast(`Fallback: ${FALLBACK_WORDS.length} words`);

}

/* ================================================================
   Word lookup
   ================================================================ */
function isKnownWord(word) {
  if (!wordSet || !word) return false;
  if (wordSet.has(word)) return true;
  try {
    const norm = word.normalize ? word.normalize("NFC") : word;
    if (norm !== word && wordSet.has(norm)) return true;
  } catch (e) {}
  return false;
}

/* ================================================================
   Flag words
   ================================================================ */
function flagWords(srcText, outText, dir) {
  if (spellMode === "off" || !spellReady || !wordSet) {
    return { html: escapeHtml(outText), errors: [] };
  }
  const srcTokens = srcText.split(/(\s+)/);
  const outTokens = outText.split(/(\s+)/);
  const canPair = srcTokens.length === outTokens.length;
  const userSet = (dir === "uni2bi") ? userDictBijoy : userDictUnicode;
  const errors = [];
  let html = "";

  outTokens.forEach((part, i) => {
    if (!part) return;
    if (/^\s+$/.test(part)) { html += escapeHtml(part); return; }
    const core = part.replace(/^[।|,.;:!?"'()\[\]{}<>—–\-]+|[।|,.;:!?"'()\[\]{}<>—–\-]+$/g, "");
    if (!core) { html += escapeHtml(part); return; }
    if (userSet.has(part) || userSet.has(core)) { html += escapeHtml(part); return; }
    const unicodeWord = (dir === "uni2bi") ? bijoyToUni(core) : core;
    if (isKnownWord(unicodeWord)) { html += escapeHtml(part); }
    else {
      const idx = errors.length;
      const srcWord = canPair ? srcTokens[i] : "";
      const uniForm = (dir === "uni2bi") ? srcWord : part;
      const bijoyForm = (dir === "uni2bi") ? part : srcWord;
      errors.push({ word: part, core, index: idx, srcWord, uni: uniForm, bijoy: bijoyForm });
      html += `<span class="flagged" data-err-idx="${idx}" data-word="${escapeHtml(part)}" data-uni="${escapeHtml(uniForm)}" data-bijoy="${escapeHtml(bijoyForm)}">${escapeHtml(part)}</span>`;
    }
  });
  return { html, errors };
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function loadUserDict() {
  try { const raw = JSON.parse(lsGet(USER_DICT_KEY, "[]")); userPairs = Array.isArray(raw) ? raw : []; }
  catch(e){ userPairs = []; }
  userDictUnicode.clear(); userDictBijoy.clear();
  userPairs.forEach(p => { if(p&&p.uni)userDictUnicode.add(p.uni); if(p&&p.bijoy)userDictBijoy.add(p.bijoy); });

function saveUserDict() { const ok = lsSet(USER_DICT_KEY, JSON.stringify(userPairs)); if(!ok)showToast("⚠ Storage full"); return ok; }
function addPair(uni, bijoy) {
  uni=(uni||"").trim(); bijoy=(bijoy||"").trim();
  if(!uni&&!bijoy)return null;
  if(userPairs.some(p=>(uni&&p.uni===uni)||(bijoy&&p.bijoy===bijoy)))return null;
  userPairs.push({uni,bijoy});
  if(uni)userDictUnicode.add(uni); if(bijoy)userDictBijoy.add(bijoy);
  saveUserDict(); return {uni,bijoy};
}
function removePair(pair) {
  userPairs = userPairs.filter(p => !(p.uni===pair.uni && p.bijoy===pair.bijoy));
  if(pair.uni)userDictUnicode.delete(pair.uni); if(pair.bijoy)userDictBijoy.delete(pair.bijoy);
  saveUserDict();
}

  lastErrors.forEach(err => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="word${direction==="uni2bi"?" bijoy":""}">${escapeHtml(err.word)}</span><span class="msg">not in dictionary</span><button class="add-dict" type="button">Add both</button>`;
    li.addEventListener("click", ev => {
      if(ev.target.classList.contains("add-dict")){ev.stopPropagation();addAndShowUndo(err.uni,err.bijoy);return;}
      highlightError(err.index);
    });
    errorList.appendChild(li);
  });
}

function renderDictList() {
  dictCount.textContent = userPairs.length;
  dictCount.className = "count"+(userPairs.length===0?" zero":"");
  dictBtnCount.textContent = "("+userPairs.length+")";
  if(userPairs.length === 0) {
    dictList.innerHTML = '<li style="justify-content:center;color:#8896a8;">No saved words yet.</li>';
    return;
  }
  dictList.innerHTML = "";
  [...userPairs].reverse().forEach(pair => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="dict-uni">${escapeHtml(pair.uni||"—")}</span><span>↔</span><span class="dict-bijoy">${escapeHtml(pair.bijoy||"—")}</span><button class="dict-del" type="button">×</button>`;
    li.querySelector(".dict-del").addEventListener("click", () => {
      removePair(pair); showToast("Removed"); updateDictStatus(spellMode==="off"?"off":"ready"); render(); renderDictList();
    });
    dictList.appendChild(li);
  });
}

function highlightError(idx) {
  const t = outputEl.querySelector('[data-err-idx="'+idx+'"]');
  if(!t)return;
  outputEl.querySelectorAll(".highlight").forEach(el=>el.classList.remove("highlight"));
  t.classList.add("highlight"); t.scrollIntoView({behavior:"smooth",block:"center"});
}

function positionAndShowTooltip(span) {
  const rect = span.getBoundingClientRect();
  const uni = span.getAttribute("data-uni")||"";
  const bijoy = span.getAttribute("data-bijoy")||"";
  tooltipPair = {uni,bijoy};
  tooltipUni.textContent = uni||"—"; tooltipBijoy.textContent = bijoy||"—";
  const tw = 240; let left = rect.left;
  if(left+tw>window.innerWidth-8)left=window.innerWidth-tw-8;
  if(left<8)left=8;
  let top = rect.bottom+6;
  if(top+160>window.innerHeight)top=Math.max(8,rect.top-150);
  tooltip.style.left = left+"px"; tooltip.style.top = top+"px";
  tooltip.classList.add("show");
}

outputEl.addEventListener("mouseover", e=>{const s=e.target.closest(".flagged");if(!s)return;clearTimeout(tooltipHideTimer);positionAndShowTooltip(s);});
outputEl.addEventListener("mouseout", e=>{const s=e.target.closest(".flagged");if(!s)return;tooltipHideTimer=setTimeout(()=>{if(!tooltip.matches(":hover"))tooltip.classList.remove("show");},250);});
tooltip.addEventListener("mouseleave",()=>tooltip.classList.remove("show"));
tooltip.addEventListener("mouseenter",()=>clearTimeout(tooltipHideTimer));
outputEl.addEventListener("scroll",()=>tooltip.classList.remove("show"),{passive:true});

addToDictBtn.addEventListener("click", ()=>{
  const {uni,bijoy} = tooltipPair;
  if(!uni && !bijoy)return;
  tooltip.classList.remove("show");
  addAndShowUndo(uni, bijoy);
});

document.querySelectorAll(".dir-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".dir-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    direction = btn.getAttribute("data-dir");
    if(direction === "uni2bi") {
      inLabel.textContent = "Unicode Input"; outLabel.textContent = "Bijoy Output";
      inputEl.placeholder = "এখানে বাংলা ইউনিকোড টেক্সট পেস্ট করুন…";
    } else {
      inLabel.textContent = "Bijoy Input"; outLabel.textContent = "Unicode Output";
      inputEl.placeholder = "Paste Bijoy text here… (e.g. Avgiv m‡bvq evsjv)";
    }
    tooltip.classList.remove("show"); render();
  });
});

function setSpellMode(mode) {
  spellMode = mode; lsSet(SPELL_MODE_KEY, mode); setActiveModeBtn(mode+"Btn");
  if(mode==="off") updateDictStatus("off");
  else if(spellReady) updateDictStatus("ready");
  render();
}
document.getElementById("lightBtn").addEventListener("click",()=>{setSpellMode("light");if(!spellReady)loadDictionary();});
document.getElementById("deepBtn").addEventListener("click",()=>{setSpellMode("deep");loadDictionary();});
document.getElementById("offBtn").addEventListener("click",()=>{setSpellMode("off");});
function setActiveModeBtn(id) { ["lightBtn","deepBtn","offBtn"].forEach(bid=>{document.getElementById(bid).classList.toggle("on",bid===id);}); }

/* Manual file input */
const dictFileInput = document.getElementById("dictFileInput");
document.getElementById("loadFileBtn").addEventListener("click", () => dictFileInput.click());
dictFileInput.addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(file) loadFromFile(file);
  e.target.value = "";
});

document.getElementById("dictBtn").addEventListener("click",()=>{
  const p = document.getElementById("dictPanel");
  p.open = !p.open; if(p.open)p.scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("clearAllDictBtn").addEventListener("click",()=>{
  if(userPairs.length===0){showToast("Already empty");return;}
  if(!confirm("Remove all "+userPairs.length+" words?"))return;
  userPairs=[];userDictUnicode.clear();userDictBijoy.clear();saveUserDict();
  showToast("Cleared");updateDictStatus(spellMode==="off"?"off":"ready");render();renderDictList();
});
document.getElementById("clearBtn").addEventListener("click",()=>{inputEl.value="";render();inputEl.focus();});
document.getElementById("copyInBtn").addEventListener("click",()=>copyText(inputEl.value,"Input copied ✓"));
document.getElementById("copyOutBtn").addEventListener("click",()=>copyText(lastOutput,"Output copied ✓"));
function copyText(text,msg){
  if(!text){showToast("Nothing to copy");return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast(msg),()=>{legacyCopy(text);showToast(msg);});
  } else { legacyCopy(text); showToast(msg); }
}
function legacyCopy(text){
  const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta);
}

inputEl.addEventListener("input", render);
inputEl.addEventListener("paste", () => setTimeout(render, 0));

/* Boot */
loadUserDict(); renderDictList();
const savedMode = lsGet(SPELL_MODE_KEY, "off");
spellMode = ["off","light","deep"].includes(savedMode) ? savedMode : "off";
setActiveModeBtn(spellMode+"Btn");
if(spellMode==="off") updateDictStatus("off");
else { updateDictStatus("loading"); loadDictionary(); }
render();
</script>
</body>
</html>
